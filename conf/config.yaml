# POFJSP Configuration
# This is the main configuration file for POFJSP experiments

# Dataset Configuration
dataset:
  name: "POFJSP"
  path: "./data/pofjsp_dataset"
  format: "json"
  num_instances: 50

# Problem Parameters
problem:
  type: "POFJSP"  # Partially Ordered Flexible Job Shop Problem
  features:
    - precedence_constraints
    - flexible_machines
    - variable_operations_per_job

# Default settings for experiments
defaults:
  output_dir: "./outputs"
  verbose: true
  seed: 42 